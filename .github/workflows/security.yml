name: security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      # Tests use the in-memory store and the emulator only — no real Firebase project, no secrets.
      NODE_ENV: test
      SECURITY_LOG_SILENT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:security
      - run: npm run test:phase3
      - run: npm run test:session-lock
      - run: npm run test:teacher-scoping
      - run: npm audit --omit=dev --audit-level=high || true

  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm i --no-save firebase-tools@14 @firebase/rules-unit-testing@5
      # demo-* project id: the emulator refuses to talk to any real project.
      - run: npx firebase emulators:exec --project demo-allied-rules-test --only firestore,storage "node --test tests/rules/"
